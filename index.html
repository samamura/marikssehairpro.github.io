  }

  .avatar {

    margin: 0 auto 36px;

  .links {

  }

  .link-btn {
    display: block;
    width: 100%;
    padding: 15px 24px;
    background-color: #fff;
    border: 1px solid #E0D8D0;
    border-radius: 12px;
    text-decoration: none;
    color: #2C2C2C;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    text-align: center;
    transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
    position: relative;
    letter-spacing: 0.2px;
  }

  .link-btn:hover {
    background-color: #F5EDE4;
    border-color: #B87E4B;
    transform: translateY(-1px);
  }

  .link-btn:active {
    transform: translateY(0px);
  }

  .link-btn.featured {
    background-color: #2C2C2C;
    border-color: #2C2C2C;
    color: #FAF7F4;
  }

  .link-btn.featured:hover {
    background-color: #3e3e3e;
    border-color: #3e3e3e;
  }

  .link-btn .badge {
    position: absolute;
    top: -8px;
    right: 14px;
    background-color: #B87E4B;
    color: #FAF7F4;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .footer {
    margin-top: 48px;
    font-size: 11px;
    color: #C9B99A;
    text-align: center;
    letter-spacing: 0.3px;
  }

  @media (max-width: 480px) {
